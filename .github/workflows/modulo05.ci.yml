# .github/workflows/modulo05-ci.yml
name: Module 05 CI

on:
  pull_request:
    paths:
      - "modulo05-testing/**"

defaults:
  run:
    working-directory: modulo05-testing

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: modulo05-testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: modulo05-testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e:ci

      - name: Upload screenshots when specs fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: modulo05-testing/cypress/screenshots

      - name: Upload videos when specs fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: modulo05-testing/cypress/videos
